# ACHTUNG: Docker umgeht die UFW-Firewall des Servers. Jeder hier unter "ports:"
# veröffentlichte Port ist weltweit erreichbar, egal was UFW erlaubt.
# Ports, die nicht öffentlich sein sollen (z.B. Postgres zum Debuggen),
# immer an localhost binden: "127.0.0.1:5432:5432" statt "5432:5432".
services:
  db:
    image: postgres:16
    restart: always
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demre"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env.prod
    environment:
      STB_EXPORT_DIR: /app/storage/exports/steuerberater
    volumes:
      - ./storage:/app/storage
      - ./Eingangsrechnungen:/app/incoming_invoices
      - ./Belege:/app/expense_receipts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    depends_on: [backend]
    ports:
      # Nur an localhost: der Host-nginx proxyt belegpilot24.de hierher.
      # Ohne die Bindung waere 8081 weltweit offen (Docker umgeht UFW, siehe oben).
      - "127.0.0.1:8081:80"

volumes:
  pgdata:
